services:
  - type: web
    name: finance-core-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: finance-core-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finance-core-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finance-core-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: finance-core-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finance-core-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL
        value: PT1H
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_NAME
        value: Finance Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: finance-core-db
    databaseName: finance_core
    user: finance_user
    plan: free
