services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance_core
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "5432:5432"
    volumes:
      - finance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build: .
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: finance_core
      DB_USER: finance_user
      DB_PASSWORD: local-development-password
      JWT_SECRET: local-compose-jwt-secret-change-before-any-public-deployment
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      ADMIN_NAME: Local Administrator
      ADMIN_EMAIL: admin@local.test
      ADMIN_PASSWORD: LocalAdmin12345

volumes:
  finance-data:
